<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Tracker</title>
    <link rel="stylesheet" href="c.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="home1.html">Home</a></li>
                <li><a href="home2.html">Streak</a></li>
                <li><a href="home3.html">Your Activity</a></li>
                <li><a href="home4.html">Level & Certificate</a></li>
            </ul>
        </nav>
    </header>

    
    <div class="content">
        <div class="section calories">
            <img src="fire-icon.png" alt="Burned Calories" class="icon">
            <h3>BURNED CALORIES</h3>
        </div>

        <div class="section target">
            <img src="exercise-icon.png" alt="Target Calories" class="icon">
            <h3>TARGET CALORIES TO BURN</h3>
        </div>

        <div class="section chart">
            <h3>Progress Chart</h3>
            <img src="chart.png" alt="Chart">
        </div>
    </div>

    <div class="footer">
        <h3>CALCULATE YOUR BODY MASS INDEX AND MANAGE YOUR ACTIVITIES</h3>
        <div class="actions">
            <div class="action">
                <img src="bmi-chart.png" alt="BMI Chart">
                <h4>BMI CHART</h4>
            </div>
            <div class="action">
                <img src="diet.png" alt="Your Diet">
                <h4>YOUR DIET</h4>
            </div>
            <div class="action">
                <img src="activity.png" alt="Your Target Activity">
                <h4>YOUR TARGET ACTIVITY</h4>
            </div>
        </div>
    </div>
</body>
</html>
