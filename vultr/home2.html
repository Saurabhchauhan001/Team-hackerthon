<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streak Dashboard</title>
    <link rel="stylesheet" href="b.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="home1.html">Home</a></li>
                <li><a href="home2.html">Streak</a></li>
                <li><a href="home3.html">Your Activity</a></li>
                <li><a href="home4.html">Level & Certificate</a></li>
            </ul>
        </nav>
    </header>


    <div class="main-content">
        <div class="goal-banner">
            <h2>Achieve 100% of Today's Goal to Maintain the Streak</h2>
            <div class="progress-bar">
                <div class="progress-done" style="width: 65%"></div>
                <div class="progress-left" style="width: 35%"></div>
            </div>
        </div>

        <div class="activity-stats">
            <div class="stat-block">
                <h3>Current Streak</h3>
                <div class="stat-value green">99 Days</div>
            </div>
            <div class="stat-block">
                <h3>Skipped Days</h3>
                <div class="stat-value red">4 Days</div>
            </div>
            <div class="stat-block">
                <h3>Total Days</h3>
                <div class="stat-value blue">103 Days</div>
            </div>
        </div>

        <div class="certificate-section">
            <div class="certificate-block">
                <h3>Current Certificate</h3>
                <p>Attained Bronze Level 3</p>
            </div>
            <div class="certificate-block">
                <h3>Next Certificate</h3>
                <p>Silver Level 1 Certificate</p>
            </div>
        </div>
    </div>
</body>
</html>
