<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health and Wellbeing Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>HEALTH AND WELLBEING</h1>
        
    </div>

    <div class="login-container">
        <div class="login-box">
            <img src="login-icon.png" alt="Login Icon" class="login-img">
            <form action="#" method="POST">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name" required>

                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last-name" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="contact-number">Contact Number</label>
                <input type="text" id="contact-number" name="contact-number" required>

                <label for="otp">OTP</label>
                <input type="text" id="otp" name="otp" required>

            <a href="home1.html">login</a>
            </form>
        </div>
    </div>
</body>
</html>
